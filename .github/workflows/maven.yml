name: Playwright UI Automation CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge, chromium ]
      environment:
        description: 'Target environment'
        required: false
        default: 'qa'
        type: choice
        options: [ dev, qa, uat, prod ]
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'
        type: boolean

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java setup ────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ── Maven dependency cache ────────────────────────────────────────────
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ── Install Playwright browsers ───────────────────────────────────────
      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      # ── Execute tests ─────────────────────────────────────────────────────
      - name: Run tests
        run: |
          mvn clean test \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=${{ github.event.inputs.headless || 'true' }} \
            -Denvironment=${{ github.event.inputs.environment || 'qa' }}
        continue-on-error: true

      # ── Upload Allure results ──────────────────────────────────────────────
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: target/allure-results
          retention-days: 30

      # ── Upload execution artefacts (screenshots, traces, videos, logs) ────
      - name: Upload execution artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-artefacts-${{ github.run_number }}
          path: target/artifacts
          retention-days: 14

      # ── Generate Allure HTML report ────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      # ── Upload Allure HTML report ──────────────────────────────────────────
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: target/site/allure-maven-plugin
          retention-days: 30

