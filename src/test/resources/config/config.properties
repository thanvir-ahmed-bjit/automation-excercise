# --------------------------------------------------
# config/config.properties
# Primary framework configuration.
# Values here are overridden by JVM system properties
# passed with -Dkey=value on the Maven command line.
# --------------------------------------------------

# Browser: chrome | chromium | firefox | edge
browser=chrome

# Run in headless mode (no GUI): true | false
headless=false

# Environment: dev | qa | uat | prod
# Selects the matching environments/<env>.properties file
environment=qa

# Global element-interaction timeout in milliseconds (must be > 0)
timeout=20000

# Page-navigation/load timeout in milliseconds (must be > 0)
navigationTimeout=60000

# Artificial slow-down in milliseconds (0 = disable)
slowMo=0

# Whether to ignore HTTPS certificate errors (default: false)
# Set true only for environments with self-signed certificates
ignoreHttpsErrors=false

# Whether to record video for each test session (default: false)
recordVideo=false

# Whether to record a Playwright trace for each test (default: true)
recordTrace=true
