# Locators for ContactUsPage
contactUsLink=a[href='/contact_us']
getInTouchHeading=//h2[normalize-space()='GET IN TOUCH']
nameInput=input[data-qa='name']
emailInput=input[data-qa='email']
subjectInput=input[data-qa='subject']
