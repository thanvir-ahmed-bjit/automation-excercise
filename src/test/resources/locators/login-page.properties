# Login form
loginFormHeading=//h2[normalize-space()='Login to your account']
emailInput=input[data-qa='login-email']
usernameInput=input[data-qa='login-email']
passwordInput=input[data-qa='login-password']
loginButton=button[data-qa='login-button']
errorMessage=form[action='/login'] p

# Signup entry form
signupFormHeading=//h2[normalize-space()='New User Signup!']
signupNameInput=input[data-qa='signup-name']
signupEmailInput=input[data-qa='signup-email']
signupButton=button[data-qa='signup-button']
signupErrorMessage=form[action='/signup'] p
